name: Shuai
options:
  bundleIdPrefix: io.github.moilk
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGNING_ALLOWED: "NO"
    # Simulator builds are ad-hoc signed so the Keychain works (-34018 without entitlements).
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "YES"
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    GENERATE_INFOPLIST_FILE: "YES"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64  # xcframework sim slice is arm64 only
packages:
  ShuaiKit:
    path: ../ShuaiKit
targets:
  Shuai:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../../fixtures/recordings/claude-cjk-120x40-pre-exit.out
        buildPhase: resources
    dependencies:
      - package: ShuaiKit
        product: ShuaiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.moilk.shuai
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ShuaiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Shuai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.moilk.shuai.tests
  ShuaiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Shuai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.moilk.shuai.uitests
schemes:
  Shuai:
    build:
      targets:
        Shuai: all
    test:
      targets: [ShuaiTests, ShuaiUITests]
