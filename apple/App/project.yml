name: Shuai
options:
  bundleIdPrefix: io.github.moilk
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    # Device signing comes from Signing.xcconfig (+ optional gitignored Local.xcconfig).
    # Simulator builds are ad-hoc signed so the Keychain works (-34018 without entitlements).
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "YES"
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    GENERATE_INFOPLIST_FILE: "YES"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64  # xcframework sim slice is arm64 only
packages:
  ShuaiKit:
    path: ../ShuaiKit
targets:
  Shuai:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../../fixtures/recordings/claude-cjk-120x40-pre-exit.out
        buildPhase: resources
      # Real recorded Claude Code hook transcript, played by the DEBUG `-debugAgentFixture`.
      - path: ../../core/shuai-agent/tests/fixtures/e2e-claude-2.1.288.jsonl
        buildPhase: resources
      # Prebuilt shuai-agent binaries (scripts/build-agent.sh, gitignored); optional so builds
      # without them still work, the installer then reports the agent as unavailable.
      - path: Resources/agent
        optional: true
        buildPhase: resources
    # An app without the agent binaries cannot enable AI integration: fail Release builds (and
    # any build with SHUAI_REQUIRE_AGENT=1, as CI sets) instead of silently shipping nothing.
    preBuildScripts:
      - name: Check bundled shuai-agent
        basedOnDependencyAnalysis: false
        script: |
          missing=""
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            [ -s "$SRCROOT/Resources/agent/shuai-agent-$t" ] || missing="$missing shuai-agent-$t"
          done
          [ -z "$missing" ] && exit 0
          msg="Bundled agent binaries missing:$missing (run scripts/build-agent.sh)"
          if [ "$CONFIGURATION" = "Release" ] || [ "${SHUAI_REQUIRE_AGENT:-0}" = "1" ]; then
            echo "error: $msg"; exit 1
          fi
          echo "warning: $msg"
    # Info.plist keys that have no INFOPLIST_KEY_ build setting (arrays): the `shuai://` URL scheme
    # of ntfy push deep links. Merged with the generated plist (GENERATE_INFOPLIST_FILE).
    info:
      path: Generated/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.github.moilk.shuai
            CFBundleURLSchemes: [shuai]
    dependencies:
      - package: ShuaiKit
        product: ShuaiApp
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(SHUAI_BUNDLE_ID)
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ShuaiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Shuai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHUAI_BUNDLE_ID).tests
  ShuaiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Shuai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHUAI_BUNDLE_ID).uitests
schemes:
  Shuai:
    build:
      targets:
        Shuai: all
    test:
      targets: [ShuaiTests, ShuaiUITests]
