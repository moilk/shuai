name: CI
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its superseded run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a change needs; a skipped job counts as passed. Docs-only changes run nothing.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      icon: ${{ steps.filter.outputs.icon }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
              - 'plugin/**'
              - '.claude-plugin/**'
              - 'fixtures/**'
              - '.github/workflows/ci.yml'
            icon:
              - 'tools/icongen/**'
              - 'brand/**'
              - 'apple/App/Resources/Assets.xcassets/**'
              - '.github/workflows/ci.yml'
            apple:
              - 'apple/**'
              - 'core/**'
              - 'scripts/**'
              - 'fixtures/**'
              - '.github/workflows/ci.yml'

  rust:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p shuai-ffi --features testkit

  icon:
    needs: changes
    if: needs.changes.outputs.icon == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/icongen
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/icongen
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Committed brand/out and the AppIcon catalog must match a fresh generate.
      - run: cargo run --release -- check
      - run: cargo run --release -- fidelity

  # Real-SSH Swift tests against the testkit xcframework. Never shipped.
  apple-kit:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build xcframework (testkit)
        run: SHUAI_FFI_TESTKIT=1 scripts/build-xcframework.sh
      - name: swift test (testkit)
        working-directory: apple/ShuaiKit
        run: SHUAI_FFI_TESTKIT=1 swift test

  # The normal xcframework is what the app is tested against and what could ship.
  apple-app:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: brew install xcodegen
      # The Linux shuai-agent binaries are bundled into the app. They only depend on core/, so the
      # cache skips the zig cross-build when core/ did not change.
      - name: Restore bundled shuai-agent binaries
        id: agent
        uses: actions/cache@v6
        with:
          path: apple/App/Resources/agent
          key: agent-${{ hashFiles('core/**/*.rs', 'core/**/Cargo.toml', 'core/Cargo.lock', 'scripts/build-agent.sh') }}
      - if: steps.agent.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
      - if: steps.agent.outputs.cache-hit != 'true'
        run: cargo install cargo-zigbuild --locked
      - name: Build bundled shuai-agent binaries
        if: steps.agent.outputs.cache-hit != 'true'
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          scripts/build-agent.sh
      - name: Script self-tests
        run: |
          scripts/test-check-no-testkit.sh
          scripts/test-check-app-icon.sh
      - name: Build xcframework (release configuration, no testkit)
        run: scripts/build-xcframework.sh
      - name: Guard - no testkit symbols in the xcframework
        run: scripts/check-no-testkit.sh
      - name: swift test (no testkit)
        working-directory: apple/ShuaiKit
        run: swift test
      - name: Generate Xcode project
        working-directory: apple/App
        run: xcodegen generate
      - name: xcodebuild test on an iPad simulator
        working-directory: apple/App
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for rt,v in sorted(d.items()) if "iOS" in rt for x in v if "iPad" in x["name"]]
          print(c[-1]["udid"] if c else "")')
          if [ -z "$UDID" ]; then echo "no iPad simulator available"; exit 1; fi
          SHUAI_REQUIRE_AGENT=1 xcodebuild test -scheme Shuai -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData"
      - name: Guard - AppIcon has default, dark and tinted renditions
        run: scripts/check-app-icon.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Shuai.app"

  agent-build:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release -p shuai-agent --target ${{ matrix.target }}
        working-directory: core
      - uses: actions/upload-artifact@v7
        with:
          name: shuai-agent-${{ matrix.target }}
          path: core/target/${{ matrix.target }}/release/shuai-agent
