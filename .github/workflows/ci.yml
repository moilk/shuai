name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p shuai-ffi --features testkit

  icon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/icongen
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/icongen
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Committed brand/out and the AppIcon catalog must match a fresh generate.
      - run: cargo run --release -- check
      - run: cargo run --release -- fidelity

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: brew install xcodegen
      # Cross-compiles shuai-agent for Linux (bundled into the app as resources).
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - name: Build bundled shuai-agent binaries
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          scripts/build-agent.sh
      - name: Script self-tests
        run: |
          scripts/test-check-no-testkit.sh
          scripts/test-check-app-icon.sh
      # 1) testkit build (in-process SSH server) for the real-SSH Swift tests. Never shipped.
      - name: Build xcframework (testkit)
        run: SHUAI_FFI_TESTKIT=1 scripts/build-xcframework.sh
      - name: swift test (testkit)
        working-directory: apple/ShuaiKit
        run: SHUAI_FFI_TESTKIT=1 swift test
      # 2) the normal build, which is what the App is tested against and what could ship.
      - name: Build xcframework (release configuration, no testkit)
        run: scripts/build-xcframework.sh
      - name: Guard - no testkit symbols in the xcframework
        run: scripts/check-no-testkit.sh
      - name: swift test (no testkit)
        working-directory: apple/ShuaiKit
        run: swift test
      - name: Generate Xcode project
        working-directory: apple/App
        run: xcodegen generate
      - name: xcodebuild test on an iPad simulator
        working-directory: apple/App
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for rt,v in sorted(d.items()) if "iOS" in rt for x in v if "iPad" in x["name"]]
          print(c[-1]["udid"] if c else "")')
          if [ -z "$UDID" ]; then echo "no iPad simulator available"; exit 1; fi
          SHUAI_REQUIRE_AGENT=1 xcodebuild test -scheme Shuai -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData"
      - name: Guard - AppIcon has default, dark and tinted renditions
        run: scripts/check-app-icon.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Shuai.app"

  agent-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release -p shuai-agent --target ${{ matrix.target }}
        working-directory: core
      - uses: actions/upload-artifact@v4
        with:
          name: shuai-agent-${{ matrix.target }}
          path: core/target/${{ matrix.target }}/release/shuai-agent
