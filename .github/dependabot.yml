version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    groups:
      cargo-core:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: cargo
    directory: /tools/icongen
    schedule:
      interval: weekly
    groups:
      cargo-icongen:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
